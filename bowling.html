<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D Bowling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#06070f;overflow:hidden;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  #app{position:fixed;inset:0;font-family:'Space Grotesk',system-ui,sans-serif;color:#eef0fb;
    user-select:none;-webkit-user-select:none;
    background:radial-gradient(120% 80% at 50% -10%, #141833 0%, #090b16 55%, #050609 100%);}
  #mount{position:absolute;inset:0;z-index:0;touch-action:none;cursor:crosshair;}
  .scrim{position:absolute;top:0;left:0;right:0;height:190px;z-index:1;pointer-events:none;
    background:linear-gradient(180deg, rgba(5,6,12,0.78) 0%, rgba(5,6,12,0) 100%);}
  .glass{background:rgba(11,13,26,0.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.09);box-shadow:0 18px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.07);}
  .mono{font-family:'JetBrains Mono',monospace;}
  @keyframes popIn{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}

  #scoreboard{position:absolute;top:18px;left:16px;z-index:3;padding:14px 16px 12px;border-radius:18px;}
  #sb-head{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  #sb-head .dot{width:9px;height:9px;border-radius:50%;background:#38e1ff;box-shadow:0 0 12px #38e1ff;}
  #sb-head .title{font-size:13px;font-weight:700;letter-spacing:5px;
    background:linear-gradient(90deg,#ffe6a8,#ffcf5c);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #sb-head .lane{font-size:9px;letter-spacing:2px;color:#6c7295;border:1px solid rgba(255,255,255,0.1);padding:2px 6px;border-radius:6px;}
  #frames{display:flex;gap:4px;align-items:stretch;}
  .fcell{display:flex;flex-direction:column;border-radius:8px;overflow:hidden;transition:all .2s;}
  .fcell .flabel{font-size:9px;color:#7a80a4;text-align:center;padding:3px 0 1px;letter-spacing:1px;}
  .fcell .fmarks{display:flex;gap:2px;justify-content:center;padding:0 3px 2px;}
  .fcell .fmark{width:14px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:3px;
    background:rgba(255,255,255,0.04);font-size:11px;font-weight:700;}
  .fcell .fcum{text-align:center;font-size:12px;font-weight:700;color:#dfe3f7;padding:1px 0 4px;min-height:18px;}

  #info{position:absolute;top:18px;right:16px;z-index:3;padding:14px 18px;border-radius:18px;text-align:right;}
  #info .lbl{font-size:10px;letter-spacing:3px;color:#6c7295;}
  #info .fnum{font-size:30px;font-weight:700;line-height:1.05;
    background:linear-gradient(90deg,#ffe6a8,#ffcf5c);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #info .throw{font-size:12px;color:#aeb3d0;margin-top:4px;letter-spacing:1px;}
  #info .pins{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:6px;}
  #info .pins .pd{width:7px;height:7px;border-radius:50%;background:#f6f7fb;box-shadow:0 0 8px rgba(246,247,251,0.7);}
  #info .pins .pv{font-size:12px;color:#cdd2ec;}

  #total{position:absolute;bottom:20px;right:18px;z-index:3;padding:11px 20px;border-radius:16px;text-align:center;}
  #total .lbl{font-size:9px;letter-spacing:3px;color:#6c7295;}
  #total .tv{font-size:34px;font-weight:700;color:#ffcf5c;line-height:1.05;text-shadow:0 0 22px rgba(255,207,92,0.35);}

  #controls{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:4;
    display:flex;flex-direction:column;align-items:center;gap:12px;}
  #hint{padding:8px 18px;border-radius:30px;font-size:12.5px;letter-spacing:.4px;color:#c2c7e3;
    display:flex;align-items:center;gap:12px;}
  #hint .sep{width:1px;height:13px;background:rgba(255,255,255,0.15);}
  #hint b{color:#38e1ff;font-weight:600;}
  #bowlBtn{pointer-events:auto;cursor:pointer;border:none;
    font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;letter-spacing:3px;color:#0a0c16;
    padding:16px 54px;border-radius:40px;background:linear-gradient(180deg,#ffe6a8,#ffcf5c);
    box-shadow:0 10px 34px rgba(255,207,92,0.45), inset 0 1px 0 rgba(255,255,255,0.5);
    transition:transform .08s, box-shadow .2s, opacity .2s;}
  #bowlBtn:active{transform:scale(.95);box-shadow:0 4px 16px rgba(255,207,92,0.4);}
  #bowlBtn:disabled{opacity:.35;cursor:default;filter:saturate(.5);}

  #turnBar{padding:8px 18px;border-radius:30px;font-size:13px;font-weight:600;display:flex;gap:12px;align-items:center;}
  #turnBar .pseg{display:flex;align-items:center;gap:7px;opacity:.4;transition:opacity .2s;}
  #turnBar .pseg.act{opacity:1;}
  #turnBar .pdot{width:8px;height:8px;border-radius:50%;}
  #turnBar .psep{width:1px;height:14px;background:rgba(255,255,255,0.15);}
  #powerWrap{width:200px;max-width:60vw;height:9px;border-radius:6px;background:rgba(255,255,255,0.08);
    overflow:hidden;border:1px solid rgba(255,255,255,0.12);opacity:0;transition:opacity .15s;}
  #powerWrap.on{opacity:1;}
  #powerFill{height:100%;width:0%;background:linear-gradient(90deg,#38e1ff,#ffe6a8,#ff5c5c);}
  #modeSel{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 14px;border-radius:30px;font-size:11px;}
  #modeSel .ml{color:#6c7295;letter-spacing:2px;}
  #modeSel .mbtn{pointer-events:auto;cursor:pointer;border:none;width:26px;height:26px;border-radius:50%;
    background:rgba(255,255,255,0.06);color:#c2c7e3;font-weight:700;font-family:inherit;font-size:12px;}
  #modeSel .mbtn.active{background:linear-gradient(180deg,#ffe6a8,#ffcf5c);color:#0a0c16;}

  #msgWrap{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;pointer-events:none;}
  #msgBox{pointer-events:auto;text-align:center;padding:30px 56px;border-radius:24px;
    background:rgba(8,9,18,0.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    animation:popIn .25s cubic-bezier(.2,1.3,.4,1);}
  #msgTitle{font-size:54px;font-weight:700;letter-spacing:2px;}
  #msgSub{font-size:16px;color:#aeb3d0;margin-top:6px;letter-spacing:1px;}
  #msgBtn{margin-top:20px;padding:13px 38px;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;
    letter-spacing:1px;color:#0a0c16;background:linear-gradient(180deg,#ffe6a8,#ffcf5c);border:none;border-radius:12px;
    cursor:pointer;box-shadow:0 8px 30px rgba(255,207,92,0.4);display:none;}

  @media (max-width:560px){
    #scoreboard{top:12px;left:10px;right:10px;padding:11px 12px 9px;}
    #sb-head .title{letter-spacing:3px;font-size:12px;}
    #frames{gap:3px;}
    .fcell .fmark{width:100%;}
    #info{top:96px;right:10px;padding:11px 14px;}
    #info .fnum{font-size:24px;}
    #total{bottom:100px;right:10px;padding:9px 15px;}
    #total .tv{font-size:26px;}
    #bowlBtn{padding:17px 64px;font-size:20px;}
    #msgTitle{font-size:40px;}
    #msgBox{padding:24px 38px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="mount"></div>
  <div class="scrim"></div>

  <div id="scoreboard" class="glass">
    <div id="sb-head">
      <div class="dot"></div>
      <div class="title">B O W L I N G</div>
      <div class="lane mono">LANE 01</div>
    </div>
    <div id="frames"></div>
  </div>

  <div id="info" class="glass">
    <div class="lbl">FRAME</div>
    <div class="fnum mono" id="frameNum">1 / 10</div>
    <div class="throw" id="throwLabel">Throw 1</div>
    <div class="pins"><span class="pd"></span><span class="pv mono" id="pinsLabel">10 pins</span></div>
  </div>

  <div id="total" class="glass">
    <div class="lbl">TOTAL</div>
    <div class="tv mono" id="totalStr">0</div>
  </div>

  <div id="controls">
    <div id="turnBar" class="glass" style="display:none;"></div>
    <div id="powerWrap"><div id="powerFill"></div></div>
    <button id="bowlBtn">HOLD TO BOWL</button>
    <div id="hint" class="glass"><span><b>Drag</b> to aim</span><span class="sep"></span><span><b>Hold</b> BOWL = power</span></div>
    <div id="modeSel" class="glass"><span class="ml">PLAYERS</span><button class="mbtn active" data-n="1">1</button><button class="mbtn" data-n="2">2</button></div>
  </div>

  <div id="msgWrap">
    <div id="msgBox">
      <div id="msgTitle"></div>
      <div id="msgSub"></div>
      <button id="msgBtn">PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
'use strict';
const T = () => window.THREE;

const C = { laneHalf:1.0, ballR:0.16, pinR:0.07, startZ:3.2, pinFrontZ:-10.0, endZ:-12.2, speed:12.0 };

const CHARGE_MS=1100, MINP=7.5, MAXP=16.5;          // hold-to-charge power range
const PLAYER_THEME=[0x38e1ff, 0xff4db8];            // lane neon colour per player
const PLAYER_HEX=['#38e1ff','#ff4db8'];

const G = {
  scene:null, camera:null, renderer:null, composer:null, mountEl:null,
  pins:[], ball:null, guide:null, guideDashes:[], guideRing:null,
  phase:'loading', aimAngle:0, pointerDown:false,
  framesData:Array.from({length:10},()=>({rolls:[]})),
  frameIndex:0, gameOver:false, pinsStanding:10, msg:null,
  standingBefore:10, settleAt:0, rollStart:0, last:0, raf:0,
  _tx:0,_ty:0.5,_tz:-5.5,
  numPlayers:1, players:[], cur:0,
  charging:false, chargeStart:0,
  theme:[], themeLight:null,
};

function pinLayout(){
  const z=C.pinFrontZ, dz=-0.31;
  return [
    [0,z],
    [-0.17,z+dz],[0.17,z+dz],
    [-0.34,z+2*dz],[0,z+2*dz],[0.34,z+2*dz],
    [-0.51,z+3*dz],[-0.17,z+3*dz],[0.17,z+3*dz],[0.51,z+3*dz],
  ];
}

function initGame(){
  const THREE=T();
  const w=innerWidth, h=innerHeight;

  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x06070f);
  scene.fog=new THREE.Fog(0x06070f,9,26);
  G.scene=scene;

  const camera=new THREE.PerspectiveCamera(52,w/h,0.1,100);
  camera.position.set(0,2.4,5.6); camera.lookAt(0,0.5,-5.5);
  G.camera=camera;

  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  G.renderer=renderer;
  G.mountEl.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x3a3f66,0.55));
  scene.add(new THREE.HemisphereLight(0x9fb4ff,0x0a0c18,0.4));
  const dir=new THREE.DirectionalLight(0xffffff,1.05);
  dir.position.set(3.5,9,5); dir.castShadow=true;
  dir.shadow.mapSize.set(1024,1024);
  const scam=dir.shadow.camera; scam.left=-4;scam.right=4;scam.top=6;scam.bottom=-16;scam.near=1;scam.far=30;
  scene.add(dir);
  const pCyan=new THREE.PointLight(0x38e1ff,0.7,14,2); pCyan.position.set(0,2.6,-10.5); scene.add(pCyan);
  G.themeLight=pCyan;
  const pGold=new THREE.PointLight(0xffcf5c,0.55,13,2); pGold.position.set(0,2.2,2.5); scene.add(pGold);
  const pViolet=new THREE.PointLight(0x8b5cff,0.4,16,2); pViolet.position.set(0,3,-5); scene.add(pViolet);

  const lane=new THREE.Mesh(new THREE.BoxGeometry(2*C.laneHalf,0.2,18),
    new THREE.MeshStandardMaterial({color:0x0c1124,roughness:0.34,metalness:0.32}));
  lane.position.set(0,-0.1,-5); lane.receiveShadow=true; scene.add(lane);

  const gutMat=new THREE.MeshStandardMaterial({color:0x05070f,roughness:0.4,metalness:0.3});
  [-1,1].forEach(s=>{
    const g=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.18,18),gutMat);
    g.position.set(s*(C.laneHalf+0.17),-0.16,-5); g.receiveShadow=true; scene.add(g);
  });

  [-1,1].forEach(s=>{
    const stripMat=new THREE.MeshStandardMaterial({color:0x0a2730,emissive:0x38e1ff,emissiveIntensity:2.2});
    const strip=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,18),stripMat);
    strip.position.set(s*(C.laneHalf+0.005),0.02,-5); scene.add(strip);
    G.theme.push(stripMat);
  });

  const foul=new THREE.Mesh(new THREE.BoxGeometry(2*C.laneHalf,0.012,0.05),
    new THREE.MeshStandardMaterial({color:0x331016,emissive:0xff3b5c,emissiveIntensity:1.6}));
  foul.position.set(0,0.012,C.startZ+0.2); scene.add(foul);

  for(let i=0;i<5;i++){
    const a=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.16,4),
      new THREE.MeshStandardMaterial({color:0x4a3a12,emissive:0xffcf5c,emissiveIntensity:0.9}));
    a.rotation.x=-Math.PI/2;
    a.position.set((i-2)*0.28,0.014,-2-Math.abs(i-2)*0.4); scene.add(a);
  }

  const wall=new THREE.Mesh(new THREE.BoxGeometry(5,4,0.3),
    new THREE.MeshStandardMaterial({color:0x0a0c1a,roughness:0.6,metalness:0.2}));
  wall.position.set(0,1.6,C.pinFrontZ-1.5); scene.add(wall);
  const neonLineMat=new THREE.MeshStandardMaterial({color:0x102a30,emissive:0x38e1ff,emissiveIntensity:2.6});
  const neonLine=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.05,0.05),neonLineMat);
  neonLine.position.set(0,0.9,C.pinFrontZ-1.35); scene.add(neonLine);
  G.theme.push(neonLineMat);
  const deck=new THREE.Mesh(new THREE.BoxGeometry(2*C.laneHalf,0.2,2),
    new THREE.MeshStandardMaterial({color:0x11173a,roughness:0.4,metalness:0.3}));
  deck.position.set(0,-0.1,C.pinFrontZ-0.45); deck.receiveShadow=true; scene.add(deck);

  G.pins=pinLayout().map(([bx,bz])=>{
    const group=makePin();
    group.position.set(bx,0,bz); scene.add(group);
    return {group,bx,bz,x:bx,z:bz,vx:0,vz:0,fall:0,knocked:false,active:true};
  });

  const ball=new THREE.Mesh(new THREE.SphereGeometry(C.ballR,32,24),
    new THREE.MeshStandardMaterial({color:0x2a1448,roughness:0.12,metalness:0.6,emissive:0x18092e,emissiveIntensity:0.35}));
  ball.castShadow=true; scene.add(ball);
  G.ball={mesh:ball,x:0,z:C.startZ,vx:0,vz:0,rolling:false,gutter:false};

  buildGuide();

  try{
    const composer=new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene,camera));
    composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(w,h),0.6,0.5,0.78));
    G.composer=composer;
  }catch(e){ G.composer=null; }

  addEventListener('resize',onResize);
  initPlayers(G.numPlayers);
  applyTheme(PLAYER_THEME[0]);
  respawnPins(); resetBall();
  G.phase='aim'; updateHUD();

  G.last=performance.now();
  G.raf=requestAnimationFrame(loop);
}

function makePin(){
  const THREE=T();
  const g=new THREE.Group();
  const white=new THREE.MeshStandardMaterial({color:0xf6f7fb,roughness:0.32,metalness:0.05});
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.046,0.072,0.30,20),white);
  body.position.y=0.15; body.castShadow=true;
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.056,18,14),white);
  head.position.y=0.33; head.castShadow=true;
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.034,0.046,0.06,18),white);
  neck.position.y=0.30;
  const red=new THREE.MeshStandardMaterial({color:0xff3b5c,roughness:0.4});
  const band=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.056,0.028,20),red); band.position.y=0.255;
  const gold=new THREE.MeshStandardMaterial({color:0xffcf5c,emissive:0x3a2a08,emissiveIntensity:0.5,roughness:0.3,metalness:0.4});
  const band2=new THREE.Mesh(new THREE.CylinderGeometry(0.058,0.061,0.02,20),gold); band2.position.y=0.215;
  g.add(body,neck,head,band,band2);
  return g;
}

function buildGuide(){
  const THREE=T();
  const guide=new THREE.Group();
  G.guideDashes=[];
  const N=11;
  for(let i=0;i<N;i++){
    const mat=new THREE.MeshBasicMaterial({color:0x38e1ff,transparent:true,opacity:0.85});
    const dash=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.012,0.30),mat);
    dash.position.set(0,0.03,-0.55-i*0.62);
    guide.add(dash); G.guideDashes.push(dash);
  }
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.022,10,28),
    new THREE.MeshBasicMaterial({color:0xffcf5c,transparent:true,opacity:0.95}));
  ring.rotation.x=Math.PI/2;
  ring.position.set(0,0.03,-0.55-N*0.62);
  guide.add(ring); G.guideRing=ring;
  guide.position.set(0,0,C.startZ-0.05);
  G.scene.add(guide); G.guide=guide;
}

// ===== players / theme =====
function initPlayers(n){
  G.numPlayers=n; G.cur=0;
  G.players=Array.from({length:n},()=>({frames:Array.from({length:10},()=>({rolls:[]}))}));
  G.framesData=G.players[0].frames;
  G.gameOver=false; G.msg=null;
}
function applyTheme(hex){
  G.theme.forEach(m=>m.emissive.setHex(hex));
  if(G.themeLight) G.themeLight.color.setHex(hex);
  G.guideDashes.forEach(d=>d.material.color.setHex(hex));
}
function nextPlayerIndex(){
  for(let k=1;k<=G.numPlayers;k++){
    const idx=(G.cur+k)%G.numPlayers;
    if(!frameComplete(G.players[idx].frames,9)) return idx;
  }
  return -1;
}
function setPlayers(n){
  initPlayers(n);
  applyTheme(PLAYER_THEME[0]);
  respawnPins(); resetBall(); G.phase='aim'; updateHUD();
}

// ===== audio (synthesised, no external files) =====
let _ac=null,_master=null,_noise=null,_knockTime=0;
function unlockAudio(){
  if(_ac){ if(_ac.state==='suspended') _ac.resume(); return; }
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    _ac=new AC();
    _master=_ac.createGain(); _master.gain.value=0.5; _master.connect(_ac.destination);
    const len=Math.floor(_ac.sampleRate*0.2);
    _noise=_ac.createBuffer(1,len,_ac.sampleRate);
    const ch=_noise.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
  }catch(e){ _ac=null; }
}
function playKnock(){
  if(!_ac) return;
  let t=_ac.currentTime; if(t<_knockTime) t=_knockTime; _knockTime=t+0.02; // stagger overlaps → clatter
  const o=_ac.createOscillator(); o.type='triangle';
  o.frequency.setValueAtTime(150+Math.random()*120,t);
  o.frequency.exponentialRampToValueAtTime(60,t+0.13);
  const g=_ac.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.3,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.connect(g).connect(_master); o.start(t); o.stop(t+0.18);
  const src=_ac.createBufferSource(); src.buffer=_noise;
  const bp=_ac.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value=1700+Math.random()*1500; bp.Q.value=0.8;
  const ng=_ac.createGain();
  ng.gain.setValueAtTime(0.22,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
  src.connect(bp).connect(ng).connect(_master); src.start(t); src.stop(t+0.08);
}
function playChime(strike){
  if(!_ac) return; const t=_ac.currentTime;
  const fr=strike?[523,659,784,1047]:[523,659,784];
  fr.forEach((f,i)=>{
    const o=_ac.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=_ac.createGain(); const st=t+i*0.07;
    g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.22,st+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,st+0.4);
    o.connect(g).connect(_master); o.start(st); o.stop(st+0.42);
  });
}

// ===== charge / throw power =====
function startCharge(){
  if(G.phase!=='aim'||G.charging) return;
  G.charging=true; G.chargeStart=performance.now();
  document.getElementById('powerWrap').classList.add('on');
}
function releaseThrow(){
  if(!G.charging) return;
  G.charging=false;
  const f=Math.max(0,Math.min(1,(performance.now()-G.chargeStart)/CHARGE_MS));
  document.getElementById('powerWrap').classList.remove('on');
  document.getElementById('powerFill').style.width='0%';
  throwBall(MINP+(MAXP-MINP)*f);
}

// ===== input =====
function setAimFromX(clientX){
  const r=G.mountEl.getBoundingClientRect();
  const nx=((clientX-r.left)/r.width)*2-1;
  G.aimAngle=Math.max(-0.20,Math.min(0.20,nx*0.23));
  if(G.guide) G.guide.rotation.y=-G.aimAngle;
}
function onPointerMove(e){
  if(G.phase!=='aim') return;
  if(e.pointerType!=='mouse' && !G.pointerDown) return;
  setAimFromX(e.clientX);
}
function onPointerDown(e){
  if(e.target && e.target.closest && e.target.closest('button')) return;
  G.pointerDown=true;
  if(G.phase==='aim') setAimFromX(e.clientX);
}
function onPointerUp(){ G.pointerDown=false; }

function throwBall(power){
  if(G.phase!=='aim') return;
  const drift=(Math.random()-0.5)*0.036;        // imperfect release → harder to repeat strikes
  const a=G.aimAngle+drift, sp=power||C.speed;
  G.standingBefore=G.pins.filter(p=>p.active&&!p.knocked).length;
  G.ball.vx=Math.sin(a)*sp; G.ball.vz=-Math.cos(a)*sp;
  G.ball.rolling=true; G.ball.gutter=false;
  G.phase='roll'; G.rollStart=performance.now();
  document.getElementById('bowlBtn').disabled=true;
  updateHUD();
}

function onResize(){
  if(!G.renderer) return;
  const w=innerWidth,h=innerHeight;
  G.camera.aspect=w/h; G.camera.updateProjectionMatrix();
  G.renderer.setSize(w,h);
  if(G.composer) G.composer.setSize(w,h);
}

function resetBall(){
  const b=G.ball;
  b.x=0;b.z=C.startZ;b.vx=0;b.vz=0;b.rolling=false;b.gutter=false;
  b.mesh.position.set(0,C.ballR,C.startZ); b.mesh.rotation.set(0,0,0);
  G.aimAngle=0; if(G.guide) G.guide.rotation.y=0;
  document.getElementById('bowlBtn').disabled=false;
}
function respawnPins(){
  G.pins.forEach(p=>{
    p.x=p.bx;p.z=p.bz;p.vx=0;p.vz=0;p.fall=0;p.knocked=false;p.active=true;
    p.group.visible=true; p.group.position.set(p.bx,0,p.bz);
    p.group.rotation.set(0,0,0); p.group.quaternion.identity();
  });
  G.pinsStanding=10;
}
function clearFallen(){
  G.pins.forEach(p=>{ if(p.knocked){p.active=false;p.group.visible=false;} });
  G.pinsStanding=G.pins.filter(p=>p.active&&!p.knocked).length;
}

function step(dt){
  const b=G.ball;
  if(G.guide) G.guide.visible=(G.phase==='aim');

  if((G.phase==='roll'||G.phase==='settle')&&b.rolling){
    b.x+=b.vx*dt; b.z+=b.vz*dt;
    b.vx*=(1-dt*0.15); b.vz*=(1-dt*0.05);
    if(Math.abs(b.x)>C.laneHalf-C.ballR*0.4 && !b.gutter) b.gutter=true;
    if(b.gutter){
      const g=b.x>0?C.laneHalf+0.17:-(C.laneHalf+0.17);
      b.x+=(g-b.x)*Math.min(1,dt*4); b.vx*=0.7; b.mesh.position.y=-0.05;
    }else{
      b.mesh.position.y=C.ballR;
      if(G.phase==='roll') ballPinCollisions();
    }
    b.mesh.position.x=b.x; b.mesh.position.z=b.z;
    const spd=Math.hypot(b.vx,b.vz);
    b.mesh.rotation.x-=(spd/C.ballR)*dt;
    // ball is "done" when it passes the deck, slows to a crawl, or runs out of time
    if(G.phase==='roll' && (b.z<C.endZ || spd<0.7 || performance.now()-G.rollStart>3500)){
      G.phase='settle'; G.settleAt=performance.now();
    }
  }

  integratePins(dt);
  if(G.phase==='roll'||G.phase==='settle') pinPinCollisions();

  const std=G.pins.filter(p=>p.active&&!p.knocked).length;
  if(std!==G.pinsStanding && (G.phase==='roll'||G.phase==='settle')){ G.pinsStanding=std; updateHUD(); }

  updateCamera(dt);

  if(G.phase==='aim'){
    const t=performance.now()/1000;
    G.guideDashes.forEach((d,i)=>{ d.material.opacity=0.30+0.55*(0.5+0.5*Math.sin(t*4-i*0.6)); });
    if(G.guideRing) G.guideRing.material.opacity=0.55+0.4*(0.5+0.5*Math.sin(t*3));
  }
  if(G.charging){
    const f=Math.min(1,(performance.now()-G.chargeStart)/CHARGE_MS);
    document.getElementById('powerFill').style.width=(f*100)+'%';
  }

  if(G.phase==='settle' && performance.now()-G.settleAt>1150) onSettled();
}

function ballPinCollisions(){
  const b=G.ball, reach=C.ballR+C.pinR+0.01;
  G.pins.forEach(p=>{
    if(!p.active||p.knocked) return;
    const dx=p.x-b.x, dz=p.z-b.z, d=Math.hypot(dx,dz);
    if(d<reach){
      const nx=dx/(d||1), nz=dz/(d||1);
      const vn=Math.max(b.vx*nx+b.vz*nz,0);            // ball's closing speed along the contact normal
      const imp=vn*0.8+2.0;
      p.vx+=nx*imp+b.vx*0.10; p.vz+=nz*imp+b.vz*0.10;
      p.knocked=true; playKnock();                     // ball-struck pin always goes down
      // ball hands its normal component to the pin and glances off (keeps tangential, slows).
      // a dead-centre hit kills the ball on the head pin -> leaves a split, like real bowling.
      b.vx=(b.vx-nx*vn*0.78)*0.9;
      b.vz=(b.vz-nz*vn*0.78)*0.9;
    }
  });
}
function pinPinCollisions(){
  const thr=C.pinR*2+0.1, KNOCK=1.75;
  const movers=G.pins.filter(p=>p.active&&p.knocked&&Math.hypot(p.vx,p.vz)>0.25);
  movers.forEach(a=>{
    G.pins.forEach(b=>{
      if(b===a||!b.active||b.knocked) return;
      const dx=b.x-a.x, dz=b.z-a.z, d=Math.hypot(dx,dz);
      if(d<thr){
        const nx=dx/(d||1), nz=dz/(d||1), spd=Math.hypot(a.vx,a.vz), push=spd*0.46;  // energy dissipates per hop
        b.vx+=nx*push; b.vz+=nz*push;
        if(Math.hypot(b.vx,b.vz)>KNOCK){ b.knocked=true; playKnock(); }  // weak transfers leave the pin standing → splits & corners survive
        a.vx*=0.5; a.vz*=0.5;
      }
    });
  });
}
function integratePins(dt){
  const THREE=T();
  G.pins.forEach(p=>{
    if(!p.active||!p.knocked) return;
    p.x+=p.vx*dt; p.z+=p.vz*dt;
    const damp=Math.max(0,1-dt*2.5); p.vx*=damp; p.vz*=damp;
    const sp=Math.hypot(p.vx,p.vz);
    p.fall=Math.min(1.45,p.fall+sp*dt*2.4+dt*0.9);
    let dx=p.vx, dz=p.vz, m=Math.hypot(dx,dz);
    if(m<0.001){dx=0;dz=-1;m=1;}
    dx/=m; dz/=m;
    const axis=new THREE.Vector3(dz,0,-dx).normalize();
    p.group.position.set(p.x,0,p.z);
    p.group.quaternion.setFromAxisAngle(axis,p.fall);
  });
}
function updateCamera(dt){
  const cam=G.camera, b=G.ball;
  let px=0,py=2.4,pz=5.6,tx=0,ty=0.5,tz=-5.5;
  if(G.phase==='roll'||G.phase==='settle'){
    pz=Math.max(b.z+5.0,-1.5); py=2.2; px=b.x*0.25;
    tx=b.x*0.4; ty=0.45; tz=b.z-3;
  }
  const k=Math.min(1,dt*2.2);
  cam.position.x+=(px-cam.position.x)*k;
  cam.position.y+=(py-cam.position.y)*k;
  cam.position.z+=(pz-cam.position.z)*k;
  G._tx+=(tx-G._tx)*k; G._ty+=(ty-G._ty)*k; G._tz+=(tz-G._tz)*k;
  cam.lookAt(G._tx,G._ty,G._tz);
}

function onSettled(){
  const standingAfter=G.pins.filter(p=>p.active&&!p.knocked).length;
  let knocked=G.standingBefore-standingAfter; if(knocked<0) knocked=0;
  const strike=G.standingBefore===10&&knocked===10;
  const spare=!strike&&G.standingBefore<10&&standingAfter===0&&knocked>0;

  const fr=G.players[G.cur].frames;
  const wasIndex=currentFrameIndex(fr);
  fr[wasIndex].rolls.push(knocked);

  const newIndex=currentFrameIndex(fr);
  const tenthDone=(wasIndex===9 && frameComplete(fr,9));
  const turnEnds=(newIndex!==wasIndex)||tenthDone;

  // same-player continuation keeps standing pins, except a 10th-frame bonus rack after strike/spare
  let fresh=false;
  if(!turnEnds){
    const rr=fr[wasIndex].rolls, last=rr[rr.length-1];
    if(wasIndex===9 && (last===10 || (rr.length===2&&rr[0]+rr[1]===10))) fresh=true;
  }

  G.phase='resolve'; updateHUD();
  if(strike) playChime(true); else if(spare) playChime(false);

  const finish=()=>{
    if(turnEnds){
      const nxt=nextPlayerIndex();
      if(nxt===-1){ endGame(); return; }
      G.cur=nxt;
      G.framesData=G.players[G.cur].frames;
      applyTheme(PLAYER_THEME[G.cur%PLAYER_THEME.length]);
      setupNextBall(true);
    }else{
      setupNextBall(fresh);
    }
  };
  if(strike||spare){
    G.msg=strike?{title:'STRIKE!',sub:'',color:'#ffcf5c',btn:false}
                :{title:'SPARE!',sub:'',color:'#38e1ff',btn:false};
    updateHUD();
    setTimeout(()=>{G.msg=null; finish();},1150);
  }else{
    setTimeout(finish,650);
  }
}
function setupNextBall(fresh){
  if(fresh) respawnPins(); else clearFallen();
  resetBall(); G.phase='aim'; updateHUD();
}
function playerTotal(i){
  const s=computeScores(G.players[i].frames); let t=0; s.forEach(x=>{if(x!=null) t=x;}); return t;
}
function endGame(){
  G.gameOver=true; G.phase='over';
  if(G.numPlayers===1){
    const total=playerTotal(0);
    G.msg={title:total>=270?'PERFECT-ish!':'GAME OVER',sub:'Final score '+total,color:'#f4f6ff',btn:true};
  }else{
    const a=playerTotal(0), b=playerTotal(1);
    if(a===b) G.msg={title:'TIE GAME',sub:a+' — '+b,color:'#f4f6ff',btn:true};
    else{
      const w=a>b?0:1;
      G.msg={title:'PLAYER '+(w+1)+' WINS',sub:a+' — '+b,color:PLAYER_HEX[w],btn:true};
    }
  }
  updateHUD();
}
function restart(){
  initPlayers(G.numPlayers);
  applyTheme(PLAYER_THEME[0]);
  respawnPins(); resetBall(); G.phase='aim'; updateHUD();
}

function frameComplete(frames,i){
  const r=frames[i].rolls;
  if(i<9) return r[0]===10||r.length>=2;
  if(r.length<2) return false;
  if(r[0]===10||r[0]+r[1]===10) return r.length>=3;
  return r.length>=2;
}
function currentFrameIndex(frames){
  frames=frames||G.framesData;
  for(let i=0;i<10;i++) if(!frameComplete(frames,i)) return i;
  return 9;
}
function computeScores(frames){
  const flat=[],first=[];
  for(let i=0;i<10;i++){ first[i]=flat.length; frames[i].rolls.forEach(r=>flat.push(r)); }
  const out=[]; let total=0;
  for(let i=0;i<10;i++){
    if(!frameComplete(frames,i)){ out.push(null); for(let j=i+1;j<10;j++) out.push(null); break; }
    const s=first[i]; let fs;
    if(i<9){
      if(flat[s]===10){ if(flat.length>s+2) fs=10+flat[s+1]+flat[s+2]; else{out.push(null);break;} }
      else if(flat[s]+flat[s+1]===10){ if(flat.length>s+2) fs=10+flat[s+2]; else{out.push(null);break;} }
      else fs=flat[s]+flat[s+1];
    }else{
      fs=frames[i].rolls.reduce((a,b)=>a+b,0);
    }
    total+=fs; out.push(total);
  }
  while(out.length<10) out.push(null);
  return out;
}
function frameMarks(f,i){
  const r=f.rolls;
  const sym=v=>v===10?'X':(v===0?'-':String(v));
  if(i<9){
    let m0='',m1='';
    if(r.length>=1){ if(r[0]===10) m1='X'; else m0=r[0]===0?'-':String(r[0]); }
    if(r.length>=2) m1=(r[0]+r[1]===10)?'/':(r[1]===0?'-':String(r[1]));
    return [m0,m1];
  }
  const m=['','',''];
  if(r.length>=1) m[0]=sym(r[0]);
  if(r.length>=2){
    if(r[0]===10) m[1]=sym(r[1]);
    else if(r[0]+r[1]===10) m[1]='/';
    else m[1]=r[1]===0?'-':String(r[1]);
  }
  if(r.length>=3){
    const a=r[1],b=r[2];
    if(r[0]===10){ if(a===10) m[2]=sym(b); else if(a+b===10) m[2]='/'; else m[2]=b===0?'-':String(b); }
    else m[2]=sym(b);
  }
  return m;
}

function markColor(v){ return v==='X'?'#ffcf5c':(v==='/'?'#38e1ff':(v==='-'?'#6c7295':'#dfe3f7')); }
function updateHUD(){
  const curIdx=G.gameOver?-1:currentFrameIndex();
  const scores=computeScores(G.framesData);

  const frames=document.getElementById('frames');
  frames.innerHTML='';
  G.framesData.forEach((f,i)=>{
    const isCur=i===curIdx;
    const marks=frameMarks(f,i);
    const cell=document.createElement('div');
    cell.className='fcell';
    cell.style.minWidth=i===9?'50px':'34px';
    cell.style.border='1px solid '+(isCur?'#ffcf5c':'rgba(255,255,255,0.08)');
    cell.style.background=isCur?'rgba(255,207,92,0.10)':'rgba(255,255,255,0.02)';
    const marksHTML=marks.map(v=>`<div class="fmark mono" style="color:${markColor(v)}">${v}</div>`).join('');
    cell.innerHTML=`<div class="flabel mono">${i+1}</div><div class="fmarks">${marksHTML}</div>`+
      `<div class="fcum mono">${scores[i]==null?'':scores[i]}</div>`;
    frames.appendChild(cell);
  });

  let total=0; scores.forEach(s=>{if(s!=null) total=s;});
  const f=G.framesData[curIdx===-1?9:curIdx];
  const throwN=(f?f.rolls.length:0)+1;
  document.getElementById('frameNum').textContent=G.gameOver?'10 / 10':((curIdx+1)+' / 10');
  document.getElementById('throwLabel').textContent=G.gameOver?'Finished':('Throw '+throwN);
  document.getElementById('pinsLabel').textContent=G.pinsStanding+(G.pinsStanding===1?' pin':' pins');
  document.getElementById('totalStr').textContent=String(total);

  const tb=document.getElementById('turnBar');
  if(G.numPlayers>1){
    tb.style.display='flex';
    tb.innerHTML=G.players.map((p,i)=>{
      const act=(i===G.cur&&!G.gameOver)?' act':'';
      return `<span class="pseg${act}"><span class="pdot" style="background:${PLAYER_HEX[i]};box-shadow:0 0 8px ${PLAYER_HEX[i]}"></span>P${i+1} ${playerTotal(i)}</span>`;
    }).join('<span class="psep"></span>');
  }else{
    tb.style.display='none';
  }

  document.getElementById('bowlBtn').disabled=(G.phase!=='aim');

  const m=G.msg, wrap=document.getElementById('msgWrap');
  if(m){
    wrap.style.display='flex';
    const tEl=document.getElementById('msgTitle');
    tEl.textContent=m.title; tEl.style.color=m.color; tEl.style.textShadow='0 0 40px '+m.color+'66';
    const box=document.getElementById('msgBox');
    box.style.border='1.5px solid '+m.color;
    box.style.boxShadow='0 0 80px '+m.color+'66, 0 30px 80px rgba(0,0,0,0.6)';
    document.getElementById('msgSub').textContent=m.sub;
    document.getElementById('msgBtn').style.display=m.btn?'inline-block':'none';
  }else{
    wrap.style.display='none';
  }
}

function loop(t){
  G.raf=requestAnimationFrame(loop);
  let dt=(t-G.last)/1000; G.last=t;
  if(dt>0.05) dt=0.05;
  step(dt);
  if(G.composer) G.composer.render(); else G.renderer.render(G.scene,G.camera);
}

window.addEventListener('DOMContentLoaded',()=>{
  G.mountEl=document.getElementById('mount');

  const bb=document.getElementById('bowlBtn');
  bb.addEventListener('pointerdown',e=>{ e.preventDefault(); try{bb.setPointerCapture(e.pointerId);}catch(_){}; unlockAudio(); startCharge(); });
  bb.addEventListener('pointerup',e=>{ e.preventDefault(); releaseThrow(); });
  bb.addEventListener('pointercancel',()=>{ if(G.charging) releaseThrow(); });

  document.getElementById('msgBtn').addEventListener('click',()=>{ unlockAudio(); restart(); });

  document.querySelectorAll('#modeSel .mbtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      unlockAudio();
      document.querySelectorAll('#modeSel .mbtn').forEach(x=>x.classList.toggle('active',x===btn));
      setPlayers(+btn.dataset.n);
    });
  });

  addEventListener('pointermove',onPointerMove);
  addEventListener('pointerdown',e=>{ unlockAudio(); onPointerDown(e); });
  addEventListener('pointerup',onPointerUp);
  addEventListener('keydown',e=>{ if(e.code==='Space'&&!e.repeat){ e.preventDefault(); unlockAudio(); startCharge(); } });
  addEventListener('keyup',e=>{ if(e.code==='Space'){ e.preventDefault(); releaseThrow(); } });
  G.mountEl.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

  const wait=()=>{ if(window.THREE && G.mountEl) initGame(); else setTimeout(wait,60); };
  wait();
});
</script>
